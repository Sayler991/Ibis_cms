<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1211">
<title>Tableau de bord — ibis Tlemcen</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="alerts.css">
</head>
<body>
<div id="app" hidden></div>
<div id="login" hidden>
  <form class="login-card" id="login-form" autocomplete="on">
    <img class="login-logo" src="../assets/logo.svg" alt="ibis Tlemcen" width="200" height="88">
    <h1>Tableau de bord</h1>
    <p class="mut">Connectez-vous avec l’e-mail et le mot de passe du patron.</p>
    <label class="f"><span>E-mail</span><input id="login-email" type="email" autocomplete="username" required autofocus></label>
    <label class="f"><span>Mot de passe</span><input id="login-pw" type="password" autocomplete="current-password" required></label>
    <p class="login-err" id="login-err" role="alert" hidden></p>
    <button class="btn btn-solid" type="submit">Se connecter</button>
  </form>
</div>
<div id="boot" class="boot">Chargement…</div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:2rem">Le tableau de bord a besoin de JavaScript.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script src="admin.js"></script>
<script src="alerts.js"></script>
</body>
</html>
